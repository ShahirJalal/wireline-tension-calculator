services:

  postgres:
    image: postgres:16-alpine
    container_name: wireline-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wireline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shahirdb

    volumes:
      - wireline-postgres-data:/var/lib/postgresql/data

    ports:
      - "5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wireline"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: wireline-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wireline
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shahirdb

    ports:
      - "8082:8081"

  frontend:
    build:
      context: ./frontend

    container_name: wireline-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4201:80"

volumes:
  wireline-postgres-data: